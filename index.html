<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVN Digital</title>
<meta name="description" content="CVN Digital, trang chính thức đang được xây dựng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
--ink:#12161c;
--paper:#ffffff;
--rule:#dcdfe4;
--muted:#5b6572;
--accent:#1b4ee0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--paper);
color:var(--ink);
font-family:"Be Vietnam Pro",system-ui,sans-serif;
font-weight:300;
line-height:1.6;
-webkit-font-smoothing:antialiased;
min-height:100vh;
display:flex;
flex-direction:column;
}
.wrap{
width:100%;
max-width:62rem;
margin:0 auto;
padding:0 1.75rem;
}
header{padding:2.25rem 0}
.mark{
font-weight:800;
font-size:.95rem;
letter-spacing:.02em;
}
main{flex:1;display:flex;align-items:center;padding:3rem 0 5rem}
h1{
font-weight:800;
font-size:clamp(2.6rem,9vw,6.5rem);
line-height:.96;
letter-spacing:-.035em;
margin:0 0 1.5rem;
max-width:14ch;
}
h1 span{display:block;color:var(--accent)}
.lede{
font-size:clamp(1.05rem,2.2vw,1.35rem);
max-width:44ch;
color:var(--muted);
margin:0 0 3rem;
}
.meta{
border-top:1px solid var(--rule);
padding-top:1.5rem;
display:flex;
flex-wrap:wrap;
gap:2.5rem 4rem;
}
.meta div{min-width:11rem}
.meta p{margin:0}
.meta .k{font-size:.8rem;color:var(--muted);margin-bottom:.35rem}
.meta .v{font-weight:500}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(27,78,224,.3)}
a:hover{border-bottom-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
footer{
border-top:1px solid var(--rule);
padding:1.5rem 0 2.5rem;
font-size:.85rem;
color:var(--muted);
}
@media (max-width:40rem){
main{padding:1.5rem 0 3rem}
.meta{gap:1.75rem}
}
</style>
</head>
<body>
<header>
<div class="wrap"><p class="mark">CVN Digital</p></div>
</header>
<main>
<div class="wrap">
<h1>Trang đang<span>dựng nội dung</span></h1>
<p class="lede">Đây là trang khởi đầu của CVN Digital. Phần nội dung chính thức sẽ được cập nhật trong thời gian tới.</p>
<div class="meta">
<div>
<p class="k">Liên hệ</p>
<p class="v"><a href="mailto:kenhcvn@gmail.com">kenhcvn@gmail.com</a></p>
</div>
<div>
<p class="k">Trang liên quan</p>
<p class="v"><a href="https://ngtduc24.github.io/">ngtduc24.github.io</a></p>
</div>
<div>
<p class="k">Địa chỉ</p>
<p class="v">cvndigitaltech.github.io</p>
</div>
</div>
</div>
</main>
<footer>
<div class="wrap">© 2026 CVN Digital</div>
</footer>
</body>
</html>
